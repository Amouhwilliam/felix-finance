services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: felix
      POSTGRES_PASSWORD: felix
      POSTGRES_DB: felix
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felix -d felix"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://felix:felix@db:5432/felix
      SYNC_DATABASE_URL: postgresql+psycopg2://felix:felix@db:5432/felix
      SCRAPE_ENABLED: "true"
      SCRAPE_INTERVAL_MINUTES: "3"
      CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://localhost:3000"]'
      LOG_LEVEL: "DEBUG"   # DEBUG shows per-ticker data; INFO shows summaries only
      # AI Insights
      AI_ENABLED: "true"
      AI_PROVIDER: "bedrock"
      AWS_REGION: "us-east-1"
      BEDROCK_MODEL_ID: "deepseek.v3.2"
      # AWS credentials are injected via the volume mount below (local dev)
      # On EC2 use an IAM role instead — remove the volume mount.
    volumes:
      - ~/.aws:/root/.aws:ro   # mount local AWS credentials read-only
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  pgdata:
